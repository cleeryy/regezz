name: Validate Test Cases

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**/*.ts'
      - 'scripts/validate-exercises.ts'
      - 'scripts/fix-test-cases.ts'
  pull_request:
    branches: [main, master]
    paths:
      - 'data/**/*.ts'
      - 'scripts/validate-exercises.ts'
      - 'scripts/fix-test-cases.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate test cases
        run: npm run validate
      
      - name: Check for test case errors
        if: failure()
        run: |
          echo "::error::Test case validation failed. Some test cases have incorrect shouldMatch values."
          echo "Run 'npm run validate:fix' locally to see the errors."
